<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Asistente Médico MRP-5G</h1>
      <p>Introduce tu email para acceder al sistema</p>
    </div>

    @if (!sent()) {
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input
          matInput
          type="email"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
          placeholder="tu@email.com"
          (keyup.enter)="requestLink()">
      </mat-form-field>

      @if (error()) {
        <p class="error-text">{{ error() }}</p>
      }

      <button
        mat-flat-button
        color="primary"
        class="full-width"
        (click)="requestLink()"
        [disabled]="!email().trim() || isSending()">
        @if (isSending()) {
          <mat-spinner diameter="20"></mat-spinner>
        } @else {
          Enviar enlace de acceso
        }
      </button>
    } @else {
      <div class="sent-state">
        <mat-icon style="font-size: 48px; color: #1976d2;">mark_email_read</mat-icon>
        <h2>Enlace enviado</h2>
        <p>Revisa tu correo <strong>{{ email() }}</strong> y haz clic en el enlace para acceder.</p>
        <p class="hint">El enlace caduca en 24 horas.</p>
      </div>
    }
  </div>
</div>
