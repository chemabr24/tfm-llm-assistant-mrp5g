services:

  postgres:
    image: postgres:16
    container_name: tfm_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tfm
      POSTGRES_PASSWORD: tfm123
      POSTGRES_DB: tfm_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tfm -d tfm_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  qdrant:
    image: qdrant/qdrant
    container_name: tfm_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/6333' 2>/dev/null && echo ok || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    container_name: tfm_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.docker
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: tfm_frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  qdrant_data:
  postgres_data: